services:
  - type: web
    name: tailor-talk-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: SERVICE_ACCOUNT_JSON
        sync: false  # Do not sync secrets to GitHub
